name: Deploy Site

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.env.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: env
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yashas809/aboutme:${{ github.sha }}
            ghcr.io/yashas809/aboutme:prod-latest

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
    steps:
      - name: Checkout home-infra
        uses: actions/checkout@v4
        with:
          repository: yashas809/home-infra
          token: ${{ secrets.HOME_INFRA_PUSH_TOKEN }}

      - name: Bump image tag
        run: |
          sed -i "s#newTag: .*#newTag: ${IMAGE_TAG}#" "apps/aboutme/overlays/prod/kustomization.yaml"
          git config user.name "aboutme-ci"
          git config user.email "aboutme-ci@users.noreply.github.com"
          git add "apps/aboutme/overlays/prod/kustomization.yaml"
          git commit -m "aboutme(prod): deploy ${IMAGE_TAG}"
          git push origin main
